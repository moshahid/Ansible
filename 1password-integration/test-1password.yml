---
- name: Test sanitized 1Password lookup
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    op_vault: "Linux-Servers"
    op_item: "REPLACE_WITH_1PASSWORD_ITEM_ID"

  tasks:
    - name: Retrieve credentials without displaying them
      ansible.builtin.set_fact:
        retrieved_username: >-
          {{ lookup(
               'community.general.onepassword',
               op_item,
               field='username',
               vault=op_vault
             ) }}
        retrieved_password: >-
          {{ lookup(
               'community.general.onepassword',
               op_item,
               field='password',
               vault=op_vault
             ) }}
      no_log: true

    - name: Confirm credentials were retrieved
      ansible.builtin.assert:
        that:
          - retrieved_username | length > 0
          - retrieved_password | length > 0
        success_msg: "Ansible successfully retrieved credentials from 1Password"
        fail_msg: "Ansible could not retrieve the required credentials"
