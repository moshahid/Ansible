---
- name: Install and start Arctic Wolf Agent on Ubuntu
  hosts: all
  become: true
  gather_facts: true
  serial: 1

  vars:
    arcticwolf_local_package: /srv/ansible/packages/arcticwolf/deb/arcticwolfagent_amd64.deb
    arcticwolf_local_customer_json: /srv/ansible/packages/arcticwolf/deb/customer.json
    arcticwolf_remote_package: /var/tmp/arcticwolfagent_amd64.deb
    arcticwolf_remote_customer_json: /var/tmp/arcticwolf-customer.json
    arcticwolf_service: arcticwolfagent.service

  pre_tasks:
    - name: Require an explicit command-line limit
      ansible.builtin.assert:
        that:
          - ansible_limit | default('') | length > 0
          - ansible_limit | default('all') != "all"
        fail_msg: >-
          Refusing to continue without a specific --limit.
          Specify an inventory group or hostname.
      run_once: true

    - name: Verify supported target
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version in ["18.04", "20.04", "22.04", "24.04", "26.04"]
          - ansible_architecture == "x86_64"
        fail_msg: >-
          Unsupported target: {{ ansible_distribution }}
          {{ ansible_distribution_version }}
          {{ ansible_architecture }}

    - name: Check Arctic Wolf package on controller
      ansible.builtin.stat:
        path: "{{ arcticwolf_local_package }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: arcticwolf_package_file

    - name: Check customer configuration on controller
      ansible.builtin.stat:
        path: "{{ arcticwolf_local_customer_json }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: arcticwolf_customer_file
      no_log: true

    - name: Verify installation files exist
      ansible.builtin.assert:
        that:
          - arcticwolf_package_file.stat.exists
          - arcticwolf_customer_file.stat.exists
        fail_msg: "Arctic Wolf package or customer.json is missing on the controller"
      run_once: true

  tasks:
    - name: Install and validate Arctic Wolf Agent
      block:
        - name: Copy Arctic Wolf package
          ansible.builtin.copy:
            src: "{{ arcticwolf_local_package }}"
            dest: "{{ arcticwolf_remote_package }}"
            owner: root
            group: root
            mode: "0640"

        - name: Copy Arctic Wolf customer configuration
          ansible.builtin.copy:
            src: "{{ arcticwolf_local_customer_json }}"
            dest: "{{ arcticwolf_remote_customer_json }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Install Arctic Wolf package
          ansible.builtin.apt:
            deb: "{{ arcticwolf_remote_package }}"
            state: present
          environment:
            DEBIAN_FRONTEND: noninteractive
            AWN_CUSTOMER_JSON: "{{ arcticwolf_remote_customer_json }}"
            DISABLE_AGENT_DESKTOP: "true"
          when: not ansible_check_mode

        - name: Enable and start Arctic Wolf service
          ansible.builtin.systemd:
            name: "{{ arcticwolf_service }}"
            enabled: true
            state: started
            daemon_reload: true
          when: not ansible_check_mode

        - name: Check Arctic Wolf service
          ansible.builtin.command:
            cmd: systemctl is-active "{{ arcticwolf_service }}"
          register: arcticwolf_service_status
          changed_when: false
          when: not ansible_check_mode

        - name: Confirm Arctic Wolf service is running
          ansible.builtin.assert:
            that:
              - arcticwolf_service_status.stdout == "active"
            success_msg: "Arctic Wolf Agent is installed and running"
            fail_msg: "Arctic Wolf Agent service is not active"
          when: not ansible_check_mode

      always:
        - name: Remove staged customer configuration
          ansible.builtin.file:
            path: "{{ arcticwolf_remote_customer_json }}"
            state: absent
          no_log: true

        - name: Remove staged installation package
          ansible.builtin.file:
            path: "{{ arcticwolf_remote_package }}"
            state: absent
