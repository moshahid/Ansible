---
- name: Install Arctic Wolf Agent on RHEL 8
  hosts: rhel_servers
  become: true
  gather_facts: true
  serial: 1

  vars:
    arcticwolf_local_package: /srv/ansible/packages/arcticwolf/rpm/arcticwolfagent.x86_64.rpm
    arcticwolf_local_customer_json: /srv/ansible/packages/arcticwolf/rpm/customer.json
    arcticwolf_remote_package: /var/tmp/arcticwolfagent.x86_64.rpm
    arcticwolf_remote_customer_json: /var/tmp/arcticwolf-customer.json
    arcticwolf_service: arcticwolfagent.service

  pre_tasks:
    - name: Verify supported target
      ansible.builtin.assert:
        that:
          - ansible_os_family == "RedHat"
          - ansible_distribution_major_version == "8"
          - ansible_architecture == "x86_64"

    - name: Verify controller files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ arcticwolf_local_package }}"
        - "{{ arcticwolf_local_customer_json }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: controller_files
      no_log: true

    - name: Assert controller files exist
      ansible.builtin.assert:
        that: controller_files.results | map(attribute='stat.exists') | min
        fail_msg: "Package or customer configuration is missing on the controller."
      run_once: true

  tasks:
    - name: Install and validate agent
      block:
        - name: Stage RPM
          ansible.builtin.copy:
            src: "{{ arcticwolf_local_package }}"
            dest: "{{ arcticwolf_remote_package }}"
            owner: root
            group: root
            mode: "0640"

        - name: Stage customer configuration
          ansible.builtin.copy:
            src: "{{ arcticwolf_local_customer_json }}"
            dest: "{{ arcticwolf_remote_customer_json }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Install RPM
          ansible.builtin.dnf:
            name: "{{ arcticwolf_remote_package }}"
            state: present
            disable_gpg_check: true
          environment:
            AWN_CUSTOMER_JSON: "{{ arcticwolf_remote_customer_json }}"
            DISABLE_AGENT_DESKTOP: "true"
          when: not ansible_check_mode

        - name: Enable and start service
          ansible.builtin.systemd:
            name: "{{ arcticwolf_service }}"
            enabled: true
            state: started
            daemon_reload: true
          when: not ansible_check_mode

        - name: Verify active service
          ansible.builtin.command: systemctl is-active {{ arcticwolf_service }}
          register: service_status
          changed_when: false
          failed_when: service_status.stdout != "active"
          when: not ansible_check_mode
      always:
        - name: Remove staged files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ arcticwolf_remote_customer_json }}"
            - "{{ arcticwolf_remote_package }}"
          no_log: true
